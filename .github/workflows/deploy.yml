name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm run install:ci

      # Blocking: the tree is tsc-clean (the four pre-existing errors were fixed in the same PR
      # that added this step), so any new type error fails CI before deploy.
      - name: Typecheck
        run: npm run typecheck

      # Ratchet, not a blanket `eslint .`: ~208 lint errors pre-date this step, so a plain lint step
      # would be red on day one. This fails only when a file's error count rises above
      # .github/lint-baseline.json. When you fix lint errors, run
      # `node scripts/lint-ratchet.mjs --update` and commit the lower baseline.
      - name: Lint (ratchet, fails on new errors only)
        run: npm run lint:ratchet

      - name: Run tests
        run: npm test

      - name: Apply new D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply fpl-edge-db --remote

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vinext deploy
